    <style>
        :root {
            --brand-red: #5c1111; 
            --brand-red-light: #7a1818;
            --brand-saffron: #b36b00;
            --brand-stone: #2a2723;
            --brand-paper: #efece6; /* Softened off-white/parchment */
            --brand-card: #f8f6f2; /* Subtle contrast for cards */
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--brand-paper);
            color: var(--brand-stone);
            scroll-behavior: smooth;
        }

        .font-playfair { font-family: 'Playfair Display', serif; }
        .font-dancing { font-family: 'Dancing Script', cursive; }

        .glass-nav {
            background: rgba(239, 236, 230, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-bottom: 1px solid rgba(0, 0, 0, 0.04);
        }

        .mithila-card-shadow {
            box-shadow: 0 12px 40px -15px rgba(42, 39, 35, 0.08);
        }

        .premium-shadow {
            box-shadow: 0 4px 20px -5px rgba(92, 17, 17, 0.12);
        }

        @keyframes subtle-float {
            0% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
            100% { transform: translateY(0); }
        }
        .animate-subtle-float { animation: subtle-float 6s ease-in-out infinite; }

        @keyframes feedback-bounce {
            0%, 100% { transform: scale(1); }
            30% { transform: scale(1.05); }
            50% { transform: scale(0.98); }
            70% { transform: scale(1.02); }
        }
        .animate-feedback-bounce { animation: feedback-bounce 0.5s cubic-bezier(0.36, 0, 0.66, -0.56); }

        /* ── Marquee (infinite scroll strip) ── */
        @keyframes marquee {
            0% { transform: translateX(0); }
            100% { transform: translateX(-50%); }
        }
        .animate-marquee {
            animation: marquee 30s linear infinite;
        }
        .animate-marquee:hover { animation-play-state: paused; }

        /* ── Slow Ken-Burns zoom for hero imagery ── */
        @keyframes slow-zoom {
            0% { transform: scale(1); }
            50% { transform: scale(1.08); }
            100% { transform: scale(1); }
        }
        .animate-slow-zoom { animation: slow-zoom 25s ease-in-out infinite; }

        /* ── Scroll-reveal (driven by Reveal.jsx via IntersectionObserver) ── */
        .reveal {
            opacity: 0;
            transform: translateY(32px);
            transition: opacity 0.9s cubic-bezier(0.16, 1, 0.3, 1), transform 0.9s cubic-bezier(0.16, 1, 0.3, 1);
            will-change: opacity, transform;
        }
        .reveal.reveal-visible {
            opacity: 1;
            transform: translateY(0);
        }
        .reveal-left { transform: translateX(-40px); }
        .reveal-left.reveal-visible { transform: translateX(0); }
        .reveal-right { transform: translateX(40px); }
        .reveal-right.reveal-visible { transform: translateX(0); }
        .reveal-scale { transform: scale(0.94); }
        .reveal-scale.reveal-visible { transform: scale(1); }

        /* ── Mithila geometric pattern divider (traditional double-line + diamond motif) ── */
        .mithila-divider {
            height: 12px;
            background-image: repeating-linear-gradient(90deg,
                var(--brand-red) 0px, var(--brand-red) 2px,
                transparent 2px, transparent 14px),
                repeating-linear-gradient(90deg,
                var(--brand-saffron) 7px, var(--brand-saffron) 9px,
                transparent 9px, transparent 21px);
            background-size: 21px 4px, 21px 4px;
            background-position: 0 0, 0 8px;
            background-repeat: repeat-x;
            opacity: 0.5;
        }

        /* ── Subtle handmade-paper texture overlay ── */
        .paper-texture {
            position: relative;
        }
        .paper-texture::before {
            content: '';
            position: absolute;
            inset: 0;
            pointer-events: none;
            opacity: 0.4;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.06'/%3E%3C/svg%3E");
        }

        /* ── Decorative border frame for imagery ── */
        .frame-double {
            outline: 1px solid rgba(92, 17, 17, 0.15);
            outline-offset: 8px;
        }

        /* ── Gold shimmer text accent ── */
        @keyframes shimmer {
            0% { background-position: -200% center; }
            100% { background-position: 200% center; }
        }
        .text-shimmer {
            background: linear-gradient(90deg, #b36b00 0%, #e3a857 25%, #b36b00 50%, #e3a857 75%, #b36b00 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: shimmer 6s linear infinite;
        }

        /* ── Hide scrollbar utility ── */
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        @media (prefers-reduced-motion: reduce) {
            .reveal { opacity: 1; transform: none; transition: none; }
            .animate-marquee, .animate-slow-zoom, .animate-subtle-float, .text-shimmer { animation: none; }
        }

        /* Custom Scrollbar - Muted */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: var(--brand-paper); }
        ::-webkit-scrollbar-thumb { 
            background: #d1cdc7; 
            border-radius: 10px;
        }
        ::-webkit-scrollbar-thumb:hover { background: var(--brand-red); }

        .form-input {
            background-color: #e9e5de;
            border: 1px solid #ddd9d0;
            transition: all 0.2s ease;
        }
        .form-input:focus {
            border-color: var(--brand-red);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px rgba(92, 17, 17, 0.04);
        }

        .heritage-border {
            position: relative;
        }
        .heritage-border::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            width: 24px;
            height: 2px;
            background: var(--brand-red);
        }

        @media print {
            /* Set page margins for print */
            @page {
                margin: 0.5in;
                size: auto;
            }
            
            /* Hide everything by default except invoice */
            body {
                visibility: hidden;
            }
            
            /* Show only the printable invoice container */
            .print\:invoice-container,
            .print\:invoice-container * {
                visibility: visible !important;
            }
            
            /* Absolute positioning to prevent empty space from affecting layout */
            .print\:invoice-container {
                position: absolute !important;
                left: 0 !important;
                top: 0 !important;
                width: 100% !important;
                height: auto !important;
                max-height: none !important;
                overflow: visible !important;
                background: white !important;
                z-index: 9999 !important;
                visibility: visible !important;
                display: block !important;
            }
            
            /* Remove fixed positioning from inner container */
            .print\:invoice-container > div:first-child {
                position: static !important;
                max-height: none !important;
                overflow: visible !important;
                border-radius: 0 !important;
                box-shadow: none !important;
                width: 100% !important;
            }

            /* Prevent App container from forcing height */
            #root, .min-h-screen {
                min-height: 0 !important;
            }
            
            /* Hide non-printable elements */
            .print\:hidden {
                display: none !important;
            }
            
            /* Reset print container styles */
            .print\:invoice-container .print\:shadow-none {
                box-shadow: none !important;
            }
            
            /* Allow page breaks */
            .print\:invoice-container {
                page-break-after: auto;
                page-break-before: auto;
            }
            
            /* Prevent breaks inside table rows */
            .print\:invoice-container table tr {
                page-break-inside: avoid;
            }
            
            /* Prevent breaks inside main sections */
            .print\:invoice-container > div > div {
                page-break-inside: avoid;
            }
        }
